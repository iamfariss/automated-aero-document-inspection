name: Tests and Windows package
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - run: python -m unittest discover -s tests -v
      - run: python tools/build_portable.py release/Aero-Inspection-Windows
      - uses: actions/upload-artifact@v4
        with:
          name: Aero-Inspection-Windows
          path: release/Aero-Inspection-Windows.zip
          retention-days: 14
